<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio</title>
  
  <!-- Google Fonts for High-Fashion Editorial Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;900&display=swap" rel="stylesheet">

  <style>
    /* Global Reset & Base Styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    body {
      background-color: #F4F0EA; /* Editorial Off-White */
      color: #000000;
      font-family: 'Noto Serif TC', serif;
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      width: 100%;
      -webkit-font-smoothing: antialiased;
    }

    /* Container setup - Mobile First 375px base, expands to 720px on 768px+ */
    .container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Editorial Line Divider */
    .divider {
      border: none;
      border-top: 1px solid #000000;
      margin: 48px 0;
      width: 100%;
    }

    /* Typography Defaults */
    h1, h2, h3 {
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .section-title {
      font-size: 28px;
      margin-bottom: 24px;
      position: relative;
      padding-bottom: 8px;
      border-bottom: 1px solid #000000;
      display: inline-block;
    }

    /* 1. Hero Section */
    .hero {
      padding-top: 24px;
      padding-bottom: 16px;
    }

    .hero .issue-tag {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: block;
    }
